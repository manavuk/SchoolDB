<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Outline -->
  <path d="M 32 10 L 52 18 V 36 C 52 47.5 42.5 54.5 32 58 C 21.5 54.5 12 47.5 12 36 V 18 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.25" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Pillars / Columns -->
  <path d="M 23 35 V 47 M 32 35 V 47 M 41 35 V 47" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 20 48 H 44 M 21 34 H 43" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Graduation Cap -->
  <path d="M 32 12 L 53 21 L 32 30 L 11 21 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M 20 25.5 V 34 C 20 37.5 44 37.5 44 34 V 25.5" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Tassel -->
  <path d="M 45 22.5 L 48 30 V 37" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="48" cy="38" r="1.5" fill="#fef08a"/>
</svg>
